# DO NOT EDIT MANUALLY.
# This file is common to all projects and managed by limen.
# Most tools can be installed directly from aqua registry without local overrides.
# Addition of non-standard tools can be discussed on https://github.com/farcloser/limen

packages:
  # No go_install entries: every Go-built tool is a tool directive in
  # tools/go.mod (book/tooling.md, "Go-built tools are go.mod tools").
  # limen itself: every repo pins the version that enforces it, so the binary
  # and the canonical files it embeds travel together (no version skew between
  # the checker and the checked). Graduates to the standard registry once
  # farcloser/limen is registered there.
  - type: github_release
    repo_owner: farcloser
    repo_name: limen
    description: Verify a repository against Farcloser engineering rules
    asset: limen_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    format: tar.gz
    # Two binaries per archive: limen, and limen-lint-go, the Go lint driver
    # the lint recipes run (book/per-language.md). Releases before it shipped
    # carry limen alone; the override keeps those installable. The top-level
    # constraint is what makes aqua consult the overrides at all.
    files:
      - name: limen
      - name: limen-lint-go
    version_constraint: semver("> 0.5.2")
    version_overrides:
      - version_constraint: semver("<= 0.5.2")
        files:
          - name: limen
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      # Signed keyless from CI: the bundle over checksums.txt transitively
      # covers every listed asset, and the identity IS the release workflow at
      # the exact tag — anything else fails the install.
      cosign:
        bundle:
          type: github_release
          asset: checksums.txt.sigstore.json
        opts:
          - --certificate-identity
          - https://github.com/farcloser/limen/.github/workflows/release.yaml@refs/tags/{{.Version}}
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
    supported_envs:
      - darwin/arm64
      - linux
      - windows
  # uutils/coreutils under every name it provides: the binary dispatches on
  # argv[0], so each applet links to it and a bare `sort`, `date` or `mktemp`
  # on the hermetic PATH is the pin on every platform — the same coreutils on
  # macOS as on Linux, not BSD here and GNU there. The list is the multicall
  # binary's own (`coreutils --list`, `[` excluded). Not on Windows: the build
  # there is a native program inside git-bash, so every path it prints is a
  # Windows path the MSYS2 tools beside it misread (`mktemp -d` handed to tar
  # fails to open) — Windows gets git-for-windows/git below instead. Carried
  # locally until the names land upstream; when upstream's asset naming
  # changes, this copy needs the same edit. Upstream publishes no checksum file
  # and no provenance: verify each asset against GitHub's release attestation
  # at every bump (`gh release verify-asset <tag> <asset> -R uutils/coreutils`),
  # which aqua cannot check itself.
  - type: github_release
    repo_owner: uutils
    repo_name: coreutils
    description: Cross-platform Rust rewrite of the GNU coreutils
    asset: coreutils-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
    format: tar.gz
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
