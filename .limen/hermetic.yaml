# DO NOT EDIT MANUALLY.
# The canonical tool set, identical in every repository and imported by
# .hermetic/hermetic.yaml. Its pins move with limen releases: Renovate bumps them in
# limen alone, and a repository receives them with the limen version it pins.
# A repository's own tools — extras, or a canonical tool at another version —
# go in .hermetic/hermetic.yaml above the import, never here.
packages:
  # Every pin is the one-line name@version form and stays so (limen fix
  # collapses a two-line `version:` pin): `aqua update` rewrites only that form
  # and treats a separate `version:` key as hand-held, and Renovate reads only
  # that form.
  # No Go-built tool is pinned here: every one is a `tool` directive in
  # .limen/tools/go.mod, built by the pinned go (book/tooling.md, "Go-built tools
  # are go.mod tools"). aqua's go_install would build it once per tool
  # version, with whichever go ran first, and share that binary.
  # The coreutils under their bare names, the same pin on every platform:
  # uutils on macOS and Linux, Git for Windows' MSYS2 coreutils on Windows.
  # The registry entries say why, and how each is verified.
  - name: uutils/coreutils@0.12.0
    registry: local
  - name: git-for-windows/git@v2.56.0.windows.4
    registry: local
  # --- binary-release tools (standard registry, aqua-verified) ---
  # Not here: golang/go. The Go toolchain is each repository's own pin, in its
  # .hermetic/hermetic.yaml above the import (seeded once by `limen fix`, Renovate's
  # afterwards): a standard-library fix must not wait for a limen release.
  - name: casey/just@1.59.0
  - name: koalaman/shellcheck@v0.11.0
  - name: forkcloser/yamlfmt@v0.2.1
    registry: local
  - name: lycheeverse/lychee@lychee-v0.24.2
  - name: goreleaser/goreleaser@v2.19.0
  - name: sigstore/cosign@v3.1.4
  - name: gotestyourself/gotestsum@v1.13.0
  - name: jqlang/jq@jq-1.8.2
  - name: cli/cli@v2.103.3
  # --- spec tooling (local registry; see .limen/hermetic-registry.yaml) ---
  - name: quint-co/quint@v0.33.0
    registry: local
  - name: forkcloser/curl@v8.23.0
    registry: local
  # tar, gtar, xz, gzip, zstd, zip and unzip, one pure-Go build on every
  # platform, so a build script unpacks and packs with the same program
  # everywhere instead of the host's (the registry entry says more).
  - name: forkcloser/compress@v0.3.0
    registry: local
  # darwin/arm64 only. Its `docker` link shadows the machine's Docker on the
  # hermetic PATH there; aqua skips the package everywhere else.
  - name: farcloser/ossein@v0.3.4
    registry: local
