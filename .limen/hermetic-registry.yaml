  # Quint (quint.sh): executable formal specifications, the model language of
  # the spec-driven testing experiment (traces in ITF, replayed against the
  # implementation). Upstream ships one bare Node-bundled binary per platform,
  # with no checksums, signatures, or attestations: sourcing-ladder rung 1 on
  # trust-on-first-use — aqua pins the checksum on first fetch. No
  # windows/arm64 asset upstream. The repo also tags `evaluator/vX.Y.Z`
  # releases (the Rust simulator that `quint run` downloads at run time into
  # $QUINT_HOME unless told `--backend=typescript`); they are a different
  # artifact and are filtered out of version resolution here.
  - type: github_release
    repo_owner: quint-co
    repo_name: quint
    description: Executable formal specifications (TLA+ semantics, ITF traces)
    asset: quint-{{.OS}}-{{.Arch}}
    format: raw
    replacements:
      darwin: macos
      windows: pc
    version_filter: not (Version startsWith "evaluator/")
    supported_envs:
      - darwin
      - linux
      - windows/amd64
  # rustup, the Rust toolchain installer (book/rust.md): the standard registry's
  # entry (v4.578.0, unchanged at main) with two deltas, each for a defect
  # recorded in book/upstream.md, so the entry retires when both are fixed:
  # - the checksum file is read by pattern. The posix .sha256 files name the
  #   asset (`<sha> *./rustup-init`), and aqua's update-checksum maps a line
  #   that names an asset back to an environment by the asset's name, the same
  #   `rustup-init` for every posix environment, so three fetches land under
  #   one wrong id and the install fails "checksum is required"; a pattern
  #   takes the bare-digest path, recorded under the fetching environment's
  #   own id.
  # - the Windows download URL ends in .exe (the file the host serves; the
  #   standard entry's URL answers 404 there), the file renamed on the way.
  # Pin it as `rust-lang/rustup@<version>` with `registry: local`.
  - name: rust-lang/rustup
    aliases:
      - name: rust-lang/rustup/rustup-init
    type: http
    repo_owner: rust-lang
    repo_name: rustup
    files:
      - name: rustup
        link: rustup
      - name: rustup-init
    description: The Rust toolchain installer
    version_source: github_tag
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        url: https://static.rust-lang.org/rustup/archive/{{.Version}}/{{.Arch}}-{{.OS}}/rustup-init
        format: raw
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        checksum:
          type: http
          url: https://static.rust-lang.org/rustup/archive/{{.Version}}/{{.Arch}}-{{.OS}}/rustup-init.sha256
          algorithm: sha256
          file_format: regexp
          pattern:
            checksum: "^([0-9a-f]{64})"
        overrides:
          - goos: windows
            url: https://static.rust-lang.org/rustup/archive/{{.Version}}/{{.Arch}}-{{.OS}}/rustup-init.exe
            files:
              - name: rustup-init
                src: rustup-init.exe
            checksum:
              type: http
              url: https://static.rust-lang.org/rustup/archive/{{.Version}}/{{.Arch}}-{{.OS}}/rustup-init.exe.sha256
              algorithm: sha256
              file_format: regexp
              pattern:
                checksum: "^([0-9a-f]{64})"
  # ossein: microVM containers on macOS. The `docker` file puts a command named
  # docker on the hermetic PATH ahead of any Docker the machine has, on purpose,
  # for the repositories that pin it: build scripts type `docker`, and get
  # ossein-docker, which execs the ossein beside it — both from this archive.
  # Elsewhere aqua's proxy falls through to the machine's own docker. Signed
  # keyless from CI like limen; darwin/arm64 only, since ossein links
  # Virtualization.framework, and aqua skips the package on every other env.
  - type: github_release
    repo_owner: farcloser
    repo_name: ossein
    description: microVM containers on macOS, with a docker-shaped front
    asset: ossein_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    format: tar.gz
    files:
      - name: ossein
      - name: ossein-docker
      - name: docker
        src: ossein-docker
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        bundle:
          type: github_release
          asset: checksums.txt.sigstore.json
        opts:
          - --certificate-identity
          - https://github.com/farcloser/ossein/.github/workflows/release.yaml@refs/tags/{{.Version}}
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
    supported_envs:
      - darwin/arm64
  # curl: forkcloser's first-party build with dependable TLS 1.3, so a recipe
  # or script that fetches by hand runs the pinned curl from the hermetic PATH
  # instead of whatever the machine or runner ships. Verified two ways on
  # install: the committed checksum, and GitHub's artifact attestation for the
  # release workflow — a plain checksum pin would discard the guarantee this
  # build exists to give. The binary sits in a versioned directory inside the
  # archive; on windows it is curl.exe with curl-ca-bundle.crt beside it. No
  # darwin/amd64: Intel Mac support was dropped upstream.
  - type: github_release
    repo_owner: forkcloser
    repo_name: curl
    description: curl with dependable TLS 1.3, first-party build (forkcloser/curl)
    asset: curl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    format: tar.gz
    files:
      - name: curl
        src: curl_{{trimV .Version}}_{{.OS}}_{{.Arch}}/curl
    overrides:
      - goos: windows
        files:
          - name: curl
            src: curl_{{trimV .Version}}_{{.OS}}_{{.Arch}}/curl.exe
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
    github_artifact_attestations:
      signer_workflow: forkcloser/curl/.github/workflows/release.yaml
    supported_envs:
      - darwin/arm64
      - linux
      - windows
  # The archive tools — tar (gtar is the same binary, under the name build
  # scripts reach for on macOS), xz, gzip, zstd, zip and unzip — in pure Go,
  # one build on every platform: forkcloser/compress. Until it a build script
  # took whatever tar the host had: GNU on Linux, bsdtar on macOS, MSYS2's on
  # a Windows runner, none of it pinned. The entry is the one the repository's
  # README carries; the release signs checksums.txt keyless and the bundle is
  # verified on install. The binaries sit at the archive root, .exe on windows.
  - type: github_release
    repo_owner: forkcloser
    repo_name: compress
    description: tar, xz, gzip, zstd, zip and unzip in pure Go (forkcloser/compress)
    asset: compress_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    format: tar.gz
    files:
      - name: tar
      - name: gtar
        src: tar
      - name: xz
      - name: gzip
      - name: zstd
      - name: zip
      - name: unzip
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        bundle:
          type: github_release
          asset: checksums.txt.sigstore.json
        opts:
          - --certificate-identity
          - https://github.com/forkcloser/compress/.github/workflows/release.yaml@refs/tags/{{.Version}}
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
    supported_envs:
      - darwin/arm64
      - linux/amd64
      - linux/arm64
      - windows/amd64
      - windows/arm64
  # The YAML formatter: forkcloser/yamlfmt, upstream google/yamlfmt with its
  # data-changing formats fixed (a placeholder leaked into output, blank lines
  # in folded scalars): on the fleet's YAML the fork changes layout only.
  # Release and verification in compress's shape; the binary at the archive
  # root, .exe on windows.
  - type: github_release
    repo_owner: forkcloser
    repo_name: yamlfmt
    description: An extensible command line tool or library to format yaml files (forkcloser/yamlfmt)
    asset: yamlfmt_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    format: tar.gz
    files:
      - name: yamlfmt
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        bundle:
          type: github_release
          asset: checksums.txt.sigstore.json
        opts:
          - --certificate-identity
          - https://github.com/forkcloser/yamlfmt/.github/workflows/release.yaml@refs/tags/{{.Version}}
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
    supported_envs:
      - darwin/arm64
      - linux/amd64
      - linux/arm64
      - windows/amd64
      - windows/arm64
