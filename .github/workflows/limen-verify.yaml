# DO NOT EDIT MANUALLY: content-pinned by limen, reset by `limen fix`.
# The shared CI lanes every repository runs, called from its own ci.yaml
# (`uses: ./.github/workflows/limen-verify.yaml`). A change here reaches every
# repository with its limen bump; the project's own jobs live in its ci.yaml.
#
# Minimal glue: GitHub's own actions pinned by SHA, hermetic at .hermetic/hermetic.yaml's
# pins, `just` running the recipes a laptop runs. No third-party actions,
# hence no egress-filtering action either.
name: limen-verify

on:
  workflow_call:
    inputs:
      os:
        # Pinned images, never -latest. macOS is not redundant: its /bin/bash
        # is 3.2, the floor the recipes target. Both windows legs run under
        # git-bash. These names are NOT the ruleset's required contexts (the
        # caller's `gate` is), so a project may trim or extend the list.
        description: The verify matrix's runners, as a JSON list.
        type: string
        default: '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "windows-2025", "windows-11-arm"]'

# No default token permissions: each job states what it needs, within what
# the caller grants (contents: read).
permissions: {}

# Explicit bash everywhere: windows defaults to PowerShell and never sees
# git-bash's environment; explicit bash also brings -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    # Generous for the windows legs, which are markedly slower.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not left behind in .git/config: nothing in this
          # workflow talks to GitHub after checkout.
          persist-credentials: false
          # Full history and refs: `just do lint commits` validates the commit
          # range against the PR's base branch, which a shallow clone lacks.
          fetch-depth: 0

      # The job's caches (.github/actions/cache): attached here, before
      # setup-hermetic, since on Windows hermetic's root is inside the cache
      # image (restored as files, the caches cost minutes of small-file writes
      # there); restored right after setup-hermetic; saved at the end.
      - uses: ./.github/actions/cache
        with:
          mode: attach

      - name: Install hermetic (pinned, verified)
        uses: ./.github/actions/setup-hermetic

      # The per-platform analysis legs compile the whole module graph five
      # times, cold, on every run without the Go caches. The pins are linked
      # by setup-hermetic: a tool downloads lazily on first use,
      # checksum-verified, so a job pays only for what its recipes run.
      - uses: ./.github/actions/cache
        with:
          mode: restore
          linter-cache: 'true'

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - uses: ./.github/actions/cache
        with:
          mode: save

  # One linux leg, not the matrix: fuzzing explores the same corpus wherever
  # it runs, so more legs cost CPU and add nothing. The recipe passes on a
  # tree with no targets or no Go module, so this job is safe in every
  # repository.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install hermetic (pinned, verified)
        uses: ./.github/actions/setup-hermetic

      # The cached corpus is what makes fuzzing cumulative across runs. Keyed
      # on the fuzz sources so a changed target restarts its corpus, and on
      # the UTC day so that the default branch saves what a day of runs found
      # (a key is never overwritten); restore-keys keep the rest. Saved on the
      # default branch only (caches.yaml), read from the event, never assumed
      # by name.
      - id: fuzzdir
        run: |
          echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.fuzzdir.outputs.dir }}
          key: fuzz-corpus-${{ runner.os }}-${{ hashFiles('**/*_fuzz_test.go', '**/fuzz_test.go') }}-${{ steps.fuzzdir.outputs.day }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-${{ hashFiles('**/*_fuzz_test.go', '**/fuzz_test.go') }}-
            fuzz-corpus-${{ runner.os }}-

      - name: Fuzz
        run: just do test go fuzz

      - if: (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && steps.corpus.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.fuzzdir.outputs.dir }}
          key: ${{ steps.corpus.outputs.cache-primary-key }}

      # A crasher is a bug with a reproducer attached; the log names the
      # target, the input file is what reproduces it locally. Uploaded only
      # on failure, and only if any was written.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/'
          if-no-files-found: ignore

  # Every pin resolves. The verify legs link only, and a link verifies
  # nothing: an asset that is missing from a release, or that fails its
  # checksum, would merge green and fail at first use. One linux leg pays for
  # the real install; aqua's package store is cached on the exact pins, so a
  # warm key costs seconds and a changed pin is always a real install. (The
  # Go-built tools are .limen/tools/go.mod directives, built by the verify legs.)
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install hermetic (pinned, verified)
        uses: ./.github/actions/setup-hermetic

      # The same store as the verify legs', so this job and the linux leg
      # share it, and no fallback here: a changed pin must be a real install,
      # which is what this job exists to prove.
      - uses: ./.github/actions/cache
        with:
          mode: restore
          go: 'false'
          aqua-fallback: 'false'

      - name: Install every pinned tool
        run: hermetic install

      # Saved on the default branch only, on a miss (caches.yaml); the verify
      # leg that shares the key may have saved it first, and a key is never
      # overwritten.
      - uses: ./.github/actions/cache
        with:
          mode: save
